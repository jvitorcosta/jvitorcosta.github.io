name: Update homepage

# Builds the page and publishes it straight to GitHub Pages. Nothing is pushed to main (the
# protect-main ruleset only takes PRs): what the build must remember between runs (data/state.json
# and the downloaded covers in assets/live) lives on the unprotected `state` branch.

on:
  schedule:
    - cron: "0 9 * * *" # 05:00 in Manaus
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update-home
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for pushing to the state branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the state branch
        id: state
        continue-on-error: true # a missing branch just means a first build from empty state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: .state

      - name: Restore saved state
        if: steps.state.outcome == 'success'
        run: |
          mkdir -p data assets/live
          cp .state/data/state.json data/state.json 2>/dev/null || true
          cp -r .state/assets/live/. assets/live/ 2>/dev/null || true

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build the homepage
        run: uv run --locked --no-dev python -m homepage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save state
        if: steps.state.outcome == 'success'
        run: |
          mkdir -p .state/data .state/assets
          cp data/state.json .state/data/state.json
          rm -rf .state/assets/live && cp -r assets/live .state/assets/live
          cd .state
          git add -A
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: refresh state"
          git push

      - name: Drop the state checkout from the site
        run: rm -rf .state

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
