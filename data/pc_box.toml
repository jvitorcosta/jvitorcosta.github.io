# Short hand-written text for PC box repos, in both languages: plain words for friends,
# at most 60 characters each. Portuguese to be reviewed by Vitor.
# Repos not listed here show their repo name and GitHub description.
# title_en, title_pt  the row's name; without them the row shows the repo name
# tag   ai, data, tool, gadget, uni or course (labels in strings.toml, tag_<name>)
# pin   true puts the row at the top, in the order of this file; the rest stay newest first
# case  optional; the row's name links to projects/<case>.html when that page exists
#       (the GitHub and "try it" links stay).

[ask-vitor]
title_en = "Ask Vitor"
title_pt = "Pergunte ao Vitor"
